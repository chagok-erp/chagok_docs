      - locationCode
      - name
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        locationCode:
          type: string
        name:
          type: string
        active:
          type: boolean
      description: 과거 이력 참조 유지, active=false 위치로 신규 GR 확정 불가. 현재고>0 비활성화 정책은 B 검토 전.
