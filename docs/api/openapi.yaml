        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GRPostRequest'
      responses:
        '200':
          description: POSTED 확정 완료 (또는 동일 요청키 성공 재조회)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
