      type: object
      required:
      - requestKey
      - purchaseOrderId
      - warehouseId
      - storageLocationId
      - items
      properties:
        requestKey:
          type: string
          minLength: 8
        purchaseOrderId:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        storageLocationId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GRItemInput'
    GoodsReceipt:
      type: object
      required:
      - id
      - grNumber
      - purchaseOrderId
      - status
      - items
      properties:
        id:
          $ref: '#/components/schemas/Id'
        grNumber:
          type: string
        purchaseOrderId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - POSTED
        postedAt:
          type: string
          format: date-time
        poStatus:
          type: string
          enum:
          - OPEN
          - PARTIALLY_RECEIVED
          - RECEIVED
        items:
          type: array
          items:
            type: object
            required:
            - purchaseOrderItemId
            - receivedQty
            properties:
              purchaseOrderItemId:
                $ref: '#/components/schemas/Id'
              receivedQty:
                $ref: '#/components/schemas/DecimalQuantity'
    StockBalance:
      type: object
      required:
      - materialId
      - warehouseId
      - storageLocationId
      - onHandQty
      properties:
        materialId:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        storageLocationId:
          $ref: '#/components/schemas/Id'
        onHandQty:
          $ref: '#/components/schemas/DecimalQuantity'
    StockMovement:
      type: object
      required:
      - id
      - materialId
      - storageLocationId
      - movementType
      - quantityDelta
      - occurredAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        materialId:
          $ref: '#/components/schemas/Id'
        storageLocationId:
          $ref: '#/components/schemas/Id'
        movementType:
          type: string
          enum:
          - OPENING
          - GR_IN
        quantityDelta:
          $ref: '#/components/schemas/DecimalQuantity'
        referenceCode:
          type: string
        occurredAt:
          type: string
          format: date-time
    AssistantChatRequest:
      type: object
      required:
      - message
      properties:
        conversationId:
          $ref: '#/components/schemas/Id'
        message:
          type: string
          minLength: 1
    AssistantChatResponse:
      type: object
      required:
      - reply
      - requiresClarification
      properties:
        conversationId:
          $ref: '#/components/schemas/Id'
        reply:
          type: string
        requiresClarification:
          type: boolean
        draftId:
          $ref: '#/components/schemas/Id'
        citations:
          type: array
          items:
            type: object
            properties:
              policyVersion:
                type: string
              clauseId:
                type: string
              effectiveDate:
                type: string
                format: date
              sourceName:
                type: string
    DocumentAnalyzeResult:
      type: object
      required:
      - jobId
      - rows
      properties:
        jobId:
          $ref: '#/components/schemas/Id'
        rows:
          type: array
          items:
            type: object
            properties:
              rowNo:
                type: integer
              rawName:
                type: string
              rawQty:
                type: string
              matchMethod:
                type: string
                enum:
                - EXACT
                - RULE
                - BM25
                - LLM
                - UNMATCHED
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    materialId:
                      $ref: '#/components/schemas/Id'
                    displayName:
                      type: string
                    rank:
                      type: integer
              reviewStatus:
                type: string
                enum:
                - READY
                - NEEDS_REVIEW
                - ERROR
    AuditLog:
      type: object
      required:
      - id
      - domain
      - action
      - occurredAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        domain:
          type: string
        action:
          type: string
        resourceId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
          example: OVER_RECEIPT
        message:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
