            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 예시 세션 쿠키명. 배포 시 Secure/HttpOnly/SameSite 및 CSRF 정책 구성 필요. 로그인 엔드포인트는 예외.
  schemas:
    Id:
      type: string
      format: uuid
    DecimalQuantity:
      type: string
      description: Decimal 문자열. Java BigDecimal/PostgreSQL NUMERIC(18,3) 제안. JSON 부동소수 오차 방지.
      pattern: ^\d+(?:\.\d{1,3})?$
      example: '60.000'
    MoneyKRW:
      type: string
      description: KRW 정수 금액(BigDecimal 문자열).
      pattern: ^\d+$
      example: '150000'
    User:
      type: object
      required:
      - id
      - displayName
      - roles
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - REQUESTER
            - APPROVER
            - PURCHASER
            - WAREHOUSE
            - ADMIN
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Material:
      type: object
      required:
      - id
      - materialCode
      - name
      - baseUnit
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        materialCode:
          type: string
        name:
          type: string
        specification:
          type: string
        baseUnit:
          type: string
          enum:
          - EA
          - SET
          - KG
          - M
          - L
        active:
          type: boolean
        referenceUnitPrice:
          $ref: '#/components/schemas/MoneyKRW'
        safetyStockQty:
          $ref: '#/components/schemas/DecimalQuantity'
    MaterialCreate:
      type: object
      required:
      - materialCode
      - name
      - baseUnit
      properties:
        materialCode:
          type: string
        name:
          type: string
        specification:
          type: string
        baseUnit:
          type: string
          enum:
          - EA
          - SET
          - KG
          - M
          - L
        referenceUnitPrice:
          $ref: '#/components/schemas/MoneyKRW'
        safetyStockQty:
          $ref: '#/components/schemas/DecimalQuantity'
    Supplier:
      type: object
      required:
      - id
      - supplierCode
      - name
      - phone
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        supplierCode:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          description: 선택 제안
        contactName:
          type: string
        active:
          type: boolean
    SupplierCreate:
      type: object
      required:
      - supplierCode
      - name
      - phone
      properties:
        supplierCode:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        contactName:
          type: string
      description: 전화번호만 필수 연락처로 보관. 이메일 선택, 입력 시 형식 검사. 외부 발신 API 없음.
    Warehouse:
      type: object
      required:
      - id
      - warehouseCode
      - name
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        warehouseCode:
          type: string
        name:
          type: string
        active:
          type: boolean
      description: active=false 창고의 과거 이력 조회 가능, 신규 GR 확정 창고로 사용 금지. 물리 삭제 대신 비활성화.
