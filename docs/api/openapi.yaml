          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      description: '허용 역할(제안): 로그인 역할


        실제 인가·상태·소유권은 서버에서 검증.'
