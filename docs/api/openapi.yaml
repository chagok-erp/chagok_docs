      description: WAREHOUSE/ADMIN 중 작성자 본인. 현재 DRAFT·expectedVersion 검증. POItem별 위치 배분 수량 SUM ≤ 최신 PO 잔량. 각 위치별 원장/현재고를
        같은 PostgreSQL 트랜잭션에서 갱신. 동일 확정 요청키 재시도는 기존 결과 반환; 실패하면 DRAFT 유지. B GR 서비스 → A PO 내부 Java 서비스.
