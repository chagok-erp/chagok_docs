openapi: 3.1.0
info:
  title: Chagok ERP API
  version: 0.1.0-draft
  description: '차곡ERP 2주차 계약 초안 (미배포). A/B 검토 전. /api/v1 및 필드명은 제안. HTTP 상태는 확정 전이며 로그인 방식은 Spring Security 세션 쿠키+CSRF 권장.


    업무 원칙: PR 헤더 일괄 승인, 1 PR → N PO, PO당 1 공급업체, GR 1회당 1 PO, 전체 트랜잭션. 실제 발주 전송/결제/승인 실행 AI Tool 없음.


    JSON Decimal/금액은 문자열 표준 제안. 변경 시 Java/React 공동 계약에서 일괄 조정.'
servers:
- url: /api/v1
  description: 제안 prefix, 팀 합의 전
tags:
- name: Auth
- name: Masters
- name: Warehouses
- name: PR
- name: Approval
- name: PO
- name: GR
- name: Stock
- name: Audit
- name: AI
- name: DocumentAI
security:
- sessionCookie: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: 로그인. 서버 세션 쿠키 발급(계약 초안).
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 필드 또는 업무 입력 검증 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      operationId: post_auth_login
  /auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃 및 서버 세션 무효화
      responses:
        '204':
          description: 성공
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: post_auth_logout
  /auth/me:
    get:
      tags:
      - Auth
      summary: 현재 인증 사용자
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: get_auth_me
  /materials:
    get:
      tags:
      - Masters
      summary: 품목 목록
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '401':
          description: 로그인 필요
