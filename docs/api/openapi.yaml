          type: string
    PRItemInput:
      type: object
      required:
      - materialId
      - quantity
      - unit
      properties:
        materialId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
          description: Material 기준단위와 일치해야 함
      description: 동일 PR에서 같은 materialId를 여러 번 입력할 수 있다. 서버는 행별 고유 prItemId/displayOrder를 생성한다. PRItem별 발주 잔량 집계.
    PRItem:
      type: object
      required:
      - itemId
      - materialId
      - quantity
      - unit
      - displayOrder
      - remainingToOrder
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        materialId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
        displayOrder:
          type: integer
        remainingToOrder:
          $ref: '#/components/schemas/DecimalQuantity'
      description: 동일 materialId를 가진 PRItem도 별개 itemId, displayOrder 및 remainingToOrder를 유지. 행 자동 병합 금지.
    PRCreate:
      type: object
      required:
      - requestKey
      - title
      - source
      - items
      properties:
        requestKey:
          type: string
          minLength: 8
        title:
          type: string
          minLength: 1
        neededByDate:
          type: string
          format: date
          description: DRAFT에서는 선택; 제출 시 필수 제안
        source:
          type: string
          enum:
          - UI
          - AGENT
          - DOCUMENT_AI
        sourceReferenceId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PRItemInput'
      description: UI/Agent/Document AI 공통 PR DRAFT 생성. 동일 materialId 반복 행 허용, 항목 ID는 저장 결과로 제공.
    PRDraft:
      type: object
      required:
      - draftId
      - status
      - version
      - items
      properties:
        draftId:
          $ref: '#/components/schemas/Id'
        prNumber:
          type: string
        title:
          type: string
        neededByDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - APPROVED
          - REJECTED
        version:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/PRItem'
    PRPatchOperation:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - UPDATE_QUANTITY
          - REMOVE_ITEM
          - ADD_ITEM
          - UPDATE_TITLE
          - UPDATE_NEEDED_BY_DATE
        itemId:
          $ref: '#/components/schemas/Id'
        materialId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
        title:
          type: string
        neededByDate:
          type:
          - string
          - 'null'
          format: date
      description: 연산 유형별 요구 필드는 서버에서 검증. AI는 itemId를 표시 행 번호와 혼동하지 않아야 함.
    PRPatch:
      type: object
      required:
      - requestKey
      - expectedVersion
      - operations
      properties:
        requestKey:
          type: string
          minLength: 8
        expectedVersion:
          type: integer
          minimum: 1
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PRPatchOperation'
    DecisionRequest:
      type: object
      properties:
        comment:
          type: string
    RejectRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
    POItemCreate:
      type: object
      required:
      - requisitionItemId
      - quantity
      - unitPrice
      properties:
        requisitionItemId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unitPrice:
          $ref: '#/components/schemas/MoneyKRW'
    POCreate:
      type: object
      required:
      - requestKey
      - prId
      - supplierId
      - items
      properties:
        requestKey:
          type: string
          minLength: 8
        prId:
          $ref: '#/components/schemas/Id'
        supplierId:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/POItemCreate'
    POItem:
      type: object
      required:
      - id
      - requisitionItemId
      - orderedQty
      - receivedQty
      - remainingToReceive
      - unit
      - unitPrice
      properties:
        id:
          $ref: '#/components/schemas/Id'
        requisitionItemId:
          $ref: '#/components/schemas/Id'
        orderedQty:
          $ref: '#/components/schemas/DecimalQuantity'
        receivedQty:
          $ref: '#/components/schemas/DecimalQuantity'
        remainingToReceive:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
        unitPrice:
          $ref: '#/components/schemas/MoneyKRW'
    PurchaseOrder:
      type: object
      required:
      - id
      - poNumber
      - prId
      - supplierId
      - status
      - items
      properties:
        id:
          $ref: '#/components/schemas/Id'
        poNumber:
          type: string
        prId:
          $ref: '#/components/schemas/Id'
        supplierId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - OPEN
          - PARTIALLY_RECEIVED
          - RECEIVED
        totalAmount:
          $ref: '#/components/schemas/MoneyKRW'
        items:
          type: array
          items:
            $ref: '#/components/schemas/POItem'
    GoodsReceipt:
      type: object
      required:
      - id
      - grNumber
      - purchaseOrderId
      - status
      - version
      - createdBy
      - items
      description: DRAFT는 입고 효과가 없고 postedAt/postedBy는 미설정. POSTED는 수정·삭제 불가, 위치별 GRItem 1행당 원장 1건.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        grNumber:
          type: string
        purchaseOrderId:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - DRAFT
          - POSTED
        version:
          type: integer
          minimum: 1
        createdBy:
          $ref: '#/components/schemas/Id'
        postedBy:
          $ref: '#/components/schemas/Id'
        postedAt:
          type: string
          format: date-time
        note:
          type: string
        poStatus:
          type: string
          enum:
          - OPEN
          - PARTIALLY_RECEIVED
          - RECEIVED
        items:
          type: array
          items:
            $ref: '#/components/schemas/GRItem'
    StockBalance:
      type: object
      required:
      - materialId
      - warehouseId
      - storageLocationId
      - onHandQty
      properties:
        materialId:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        storageLocationId:
          $ref: '#/components/schemas/Id'
        onHandQty:
          $ref: '#/components/schemas/DecimalQuantity'
    StockMovement:
      type: object
      required:
      - id
      - materialId
      - storageLocationId
      - movementType
      - quantityDelta
      - occurredAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        materialId:
          $ref: '#/components/schemas/Id'
        storageLocationId:
          $ref: '#/components/schemas/Id'
        movementType:
          type: string
          enum:
          - OPENING
          - GR_IN
        quantityDelta:
          $ref: '#/components/schemas/DecimalQuantity'
        referenceCode:
          type: string
        occurredAt:
          type: string
          format: date-time
    AssistantChatRequest:
      type: object
      required:
      - message
      properties:
        conversationId:
          $ref: '#/components/schemas/Id'
        message:
          type: string
          minLength: 1
    AssistantChatResponse:
      type: object
      required:
      - reply
      - requiresClarification
      properties:
        conversationId:
          $ref: '#/components/schemas/Id'
        reply:
          type: string
        requiresClarification:
          type: boolean
        draftId:
          $ref: '#/components/schemas/Id'
        citations:
          type: array
          items:
            type: object
            properties:
              policyVersion:
                type: string
              clauseId:
                type: string
              effectiveDate:
                type: string
                format: date
              sourceName:
                type: string
    DocumentAnalyzeResult:
      type: object
      required:
      - jobId
      - rows
      properties:
        jobId:
          $ref: '#/components/schemas/Id'
        rows:
          type: array
          items:
            type: object
            properties:
              rowNo:
                type: integer
              rawName:
                type: string
              rawQty:
                type: string
              matchMethod:
                type: string
                enum:
                - EXACT
                - RULE
                - BM25
                - LLM
                - UNMATCHED
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    materialId:
                      $ref: '#/components/schemas/Id'
                    displayName:
                      type: string
                    rank:
                      type: integer
              reviewStatus:
                type: string
                enum:
                - READY
                - NEEDS_REVIEW
                - ERROR
    AuditLog:
      type: object
      required:
      - id
      - domain
      - action
      - occurredAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        domain:
          type: string
        action:
          type: string
        resourceId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
          example: OVER_RECEIPT
        message:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
    GRDraftItemInput:
      type: object
      description: 부분 입력 허용. DRAFT에는 빈 행/미지정 POItem·위치·수량 가능; POSTED 확정에서는 모든 필드가 존재해야 한다. 동일 POItem을 서로 다른 저장위치로
        반복할 수 있다.
      properties:
        purchaseOrderItemId:
          $ref: '#/components/schemas/Id'
        receivedQty:
          $ref: '#/components/schemas/DecimalQuantity'
        storageLocationId:
          $ref: '#/components/schemas/Id'
        unit:
          type: string
          description: 품목 기준단위; 확정 시 검증
        displayOrder:
          type: integer
          minimum: 1
          description: 폼 행 순서; 없으면 서버가 순차 부여
    GRDraftCreate:
      type: object
      required:
      - requestKey
      - purchaseOrderId
      description: GR 임시저장 생성. PO 지정 및 서버 인증 작성자는 필수. warehouseId/배분행은 아직 미완성이어도 된다. 저장 시 PO·원장·현재고를 변경하지 않는다.
      properties:
        requestKey:
          type: string
          minLength: 8
          maxLength: 100
        purchaseOrderId:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/GRDraftItemInput'
          default: []
    GRDraftPatch:
      type: object
      required:
      - requestKey
      - expectedVersion
      description: DRAFT 전용 수정. 명시한 items는 전체 배분행 목록을 교체한다(누락 시 유지, []면 비움). PO 참조는 DRAFT 생성 후 변경 불가. 같은 expectedVersion
        경합이면 409.
      properties:
        requestKey:
          type: string
          minLength: 8
          maxLength: 100
        expectedVersion:
          type: integer
          minimum: 1
        warehouseId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/GRDraftItemInput'
    GRPostRequest:
      type: object
      required:
      - requestKey
      - expectedVersion
      description: DRAFT→POSTED 확정. 요청 fingerprint는 draftId + expectedVersion + 서버에 저장된 초안 스냅샷의 정규화 결과 기준. 동일 키/동일
        스냅샷 재시도 시 기존 확정 결과 반환, 키 재사용·다른 본문은 409. 이전 버전은 409.
      properties:
        requestKey:
          type: string
          minLength: 8
          maxLength: 100
        expectedVersion:
          type: integer
          minimum: 1
    GRItem:
      type: object
      required:
      - id
      - displayOrder
      description: DRAFT의 미완성 항목은 선택 필드가 누락될 수 있음. POSTED는 purchaseOrderItemId/receivedQty/storageLocationId/unit
        모두 존재.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayOrder:
          type: integer
          minimum: 1
        purchaseOrderItemId:
          $ref: '#/components/schemas/Id'
        receivedQty:
          $ref: '#/components/schemas/DecimalQuantity'
        storageLocationId:
          $ref: '#/components/schemas/Id'
        unit:
          type: string
