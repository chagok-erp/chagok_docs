components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 예시 세션 쿠키명. 배포 시 Secure/HttpOnly/SameSite 및 CSRF 정책 구성 필요. 로그인 엔드포인트는 예외.
  schemas:
    Id:
      type: string
      format: uuid
    DecimalQuantity:
      type: string
      description: Decimal 문자열. Java BigDecimal/PostgreSQL NUMERIC(18,3) 제안. JSON 부동소수 오차 방지.
      pattern: ^\d+(?:\.\d{1,3})?$
      example: '60.000'
    MoneyKRW:
      type: string
      description: KRW 정수 금액(BigDecimal 문자열).
      pattern: ^\d+$
      example: '150000'
    User:
      type: object
      required:
      - id
      - displayName
      - roles
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - REQUESTER
            - APPROVER
            - PURCHASER
            - WAREHOUSE
            - ADMIN
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Material:
      type: object
      required:
      - id
      - materialCode
      - name
      - baseUnit
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        materialCode:
          type: string
        name:
          type: string
        specification:
          type: string
        baseUnit:
          type: string
          enum:
          - EA
          - SET
          - KG
          - M
          - L
        active:
          type: boolean
        referenceUnitPrice:
          $ref: '#/components/schemas/MoneyKRW'
        safetyStockQty:
          $ref: '#/components/schemas/DecimalQuantity'
    MaterialCreate:
      type: object
      required:
      - materialCode
      - name
      - baseUnit
      properties:
        materialCode:
          type: string
        name:
          type: string
        specification:
          type: string
        baseUnit:
          type: string
          enum:
          - EA
          - SET
          - KG
          - M
          - L
        referenceUnitPrice:
          $ref: '#/components/schemas/MoneyKRW'
        safetyStockQty:
          $ref: '#/components/schemas/DecimalQuantity'
    Supplier:
      type: object
      required:
      - id
      - supplierCode
      - name
      - phone
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        supplierCode:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          description: 선택 제안
        contactName:
          type: string
        active:
          type: boolean
    SupplierCreate:
      type: object
      required:
      - supplierCode
      - name
      - phone
      properties:
        supplierCode:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        contactName:
          type: string
    Warehouse:
      type: object
      required:
      - id
      - warehouseCode
      - name
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        warehouseCode:
          type: string
        name:
          type: string
        active:
          type: boolean
    WarehouseCreate:
      type: object
      required:
      - warehouseCode
      - name
      properties:
        warehouseCode:
          type: string
        name:
          type: string
    StorageLocation:
      type: object
      required:
      - id
      - warehouseId
      - locationCode
      - name
      - active
      properties:
        id:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        locationCode:
          type: string
        name:
          type: string
        active:
          type: boolean
    StorageLocationCreate:
      type: object
      required:
      - warehouseId
      - locationCode
      - name
      properties:
        warehouseId:
          $ref: '#/components/schemas/Id'
        locationCode:
          type: string
        name:
          type: string
    PRItemInput:
      type: object
      required:
      - materialId
      - quantity
      - unit
      properties:
        materialId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
          description: Material 기준단위와 일치해야 함
    PRItem:
      type: object
      required:
      - itemId
      - materialId
      - quantity
      - unit
      - displayOrder
      - remainingToOrder
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        materialId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
        displayOrder:
          type: integer
        remainingToOrder:
          $ref: '#/components/schemas/DecimalQuantity'
    PRCreate:
      type: object
      required:
      - requestKey
      - title
      - source
      - items
      properties:
        requestKey:
          type: string
          minLength: 8
        title:
          type: string
          minLength: 1
        neededByDate:
          type: string
          format: date
          description: DRAFT에서는 선택; 제출 시 필수 제안
        source:
          type: string
          enum:
          - UI
          - AGENT
          - DOCUMENT_AI
        sourceReferenceId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PRItemInput'
    PRDraft:
      type: object
      required:
      - draftId
      - status
      - version
      - items
      properties:
        draftId:
          $ref: '#/components/schemas/Id'
        prNumber:
          type: string
        title:
          type: string
        neededByDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - APPROVED
          - REJECTED
        version:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/PRItem'
    PRPatchOperation:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - UPDATE_QUANTITY
          - REMOVE_ITEM
          - ADD_ITEM
          - UPDATE_TITLE
          - UPDATE_NEEDED_BY_DATE
        itemId:
          $ref: '#/components/schemas/Id'
        materialId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
        title:
          type: string
        neededByDate:
          type:
          - string
          - 'null'
          format: date
      description: 연산 유형별 요구 필드는 서버에서 검증. AI는 itemId를 표시 행 번호와 혼동하지 않아야 함.
    PRPatch:
      type: object
      required:
      - requestKey
      - expectedVersion
      - operations
      properties:
        requestKey:
          type: string
          minLength: 8
        expectedVersion:
          type: integer
          minimum: 1
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PRPatchOperation'
    DecisionRequest:
      type: object
      properties:
        comment:
          type: string
    RejectRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
    POItemCreate:
      type: object
      required:
      - requisitionItemId
      - quantity
      - unitPrice
      properties:
        requisitionItemId:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/DecimalQuantity'
        unitPrice:
          $ref: '#/components/schemas/MoneyKRW'
    POCreate:
      type: object
      required:
      - requestKey
      - prId
      - supplierId
      - items
      properties:
        requestKey:
          type: string
          minLength: 8
        prId:
          $ref: '#/components/schemas/Id'
        supplierId:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/POItemCreate'
    POItem:
      type: object
      required:
      - id
      - requisitionItemId
      - orderedQty
      - receivedQty
      - remainingToReceive
      - unit
      - unitPrice
      properties:
        id:
          $ref: '#/components/schemas/Id'
        requisitionItemId:
          $ref: '#/components/schemas/Id'
        orderedQty:
          $ref: '#/components/schemas/DecimalQuantity'
        receivedQty:
          $ref: '#/components/schemas/DecimalQuantity'
        remainingToReceive:
          $ref: '#/components/schemas/DecimalQuantity'
        unit:
          type: string
        unitPrice:
          $ref: '#/components/schemas/MoneyKRW'
    PurchaseOrder:
      type: object
      required:
      - id
      - poNumber
      - prId
      - supplierId
      - status
      - items
      properties:
        id:
          $ref: '#/components/schemas/Id'
        poNumber:
          type: string
        prId:
          $ref: '#/components/schemas/Id'
        supplierId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - OPEN
          - PARTIALLY_RECEIVED
          - RECEIVED
        totalAmount:
          $ref: '#/components/schemas/MoneyKRW'
        items:
          type: array
          items:
            $ref: '#/components/schemas/POItem'
    GRItemInput:
      type: object
      required:
      - purchaseOrderItemId
      - receivedQty
      properties:
        purchaseOrderItemId:
          $ref: '#/components/schemas/Id'
        receivedQty:
          $ref: '#/components/schemas/DecimalQuantity'
