openapi: 3.1.0
info:
  title: Chagok ERP API
  version: 0.2.0-design-draft
  description: '차곡ERP A의 B 피드백 수용 설계안 (2026-11-18). 실제 Spring Boot 구현/팀 최종 승인 전.

    PR 헤더 일괄 승인, 1 PR→N PO, 동일 PR 품목 중복 행 허용(각 prItemId 고유), 한 PO→여러 GR.

    GR은 DRAFT 저장/수정 이후 명시적 POSTED 확정. DRAFT는 PO 누적·원장·현재고 영향 0.

    한 GR은 한 PO·한 창고, 같은 POItem은 서로 다른 활성 저장위치로 반복 배분 가능.

    확정은 최신 POItem별 합산 잔량 검증, 요청키 멱등성, 버전 확인, 단일 DB 트랜잭션.

    POST /goods-receipts는 이전 즉시 확정 계약에서 DRAFT 생성으로 변경되므로 프런트/백 동시 반영 필요.

    JSON 수량·금액은 BigDecimal 대응 문자열. 인증은 Spring Security 세션/CSRF.

    '
